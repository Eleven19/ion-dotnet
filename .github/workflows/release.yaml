name: Ion DotNet Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Check release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Eleven19.IonDotnet/Eleven19.IonDotnet.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
      - name: Build
        run: dotnet build --configuration Release
      - name: Unit test
        run: dotnet test --configuration Release --no-build --no-restore --verbosity normal --framework net7.0

  release:
    name: Publish to NuGet
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Pack
        run: dotnet pack Eleven19.IonDotnet/Eleven19.IonDotnet.csproj --configuration Release --output artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
