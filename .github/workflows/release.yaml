name: Ion DotNet Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Check release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Eleven19.IonDotnet/Eleven19.IonDotnet.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }
      - name: Build
        run: dotnet build --configuration Release
      - name: Unit test
        run: dotnet test --configuration Release --no-build --no-restore --verbosity normal --framework net7.0

  release:
    name: Publish to NuGet
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Build
        run: dotnet build Eleven19.IonDotnet/Eleven19.IonDotnet.csproj --configuration Release
      - name: Pack
        run: dotnet pack Eleven19.IonDotnet/Eleven19.IonDotnet.csproj --configuration Release --no-build --output artifacts
      - name: Show trusted publishing identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://www.nuget.org');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const fields = ['repository', 'repository_id', 'repository_owner', 'repository_owner_id', 'job_workflow_ref', 'environment', 'event_name'];
            for (const field of fields) {
              core.info(`${field}: ${claims[field] ?? '(absent)'}`);
            }
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
